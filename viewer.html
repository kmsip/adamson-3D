<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Viewer</title>

    <link rel="stylesheet" href="style.css">

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

</head>

<body>

    <a href="index.html" class="back-button">
        ← Tagasi / Back
    </a>

    <header class="viewer-header">

        <h1 id="model-name">Laadin.../Loading...</h1>

    </header>

    <main>

        <button id="fullscreenButton">

            ⛶

        </button>

        <model-viewer id="viewer" camera-controls auto-rotate shadow-intensity="1" exposure="1.2" loading="eager"
            touch-action="pan-y" interaction-prompt="auto">

        </model-viewer>

    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const model = params.get("model");

        if (model) {
            document.getElementById("viewer").src = "models/" + model;
            fetch("models.json")
                .then(response => response.json())
                .then(models => {

                    const current = models.find(
                        m => m.file === model
                    );

                    if (current) {

                        document.getElementById("model-name").textContent =
                            current.name;

                    }

                });
        } else {
            document.getElementById("model-name").textContent = "Mudelit pole valitud / No model selected";
        }

    </script>

</body>

</html>
