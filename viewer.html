<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adamson 3D</title>

    <link rel="stylesheet" href="style.css">

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

</head>

<body class="viewer-page">

    <a href="index.html" class="back-button">
        ← Tagasi / Back
    </a>

    <button id="fullscreenButton">

        ⛶

    </button>

    <header class="viewer-header">

        <h1 id="model-name">Laadin.../Loading...</h1>

    </header>

    <main class="viewer-main">


        <model-viewer id="viewer" camera-controls auto-rotate shadow-intensity="1" exposure="1.2"
            environment-image="neutral" loading="eager" touch-action="pan-y" interaction-prompt="auto">

        </model-viewer>

    </main>

    <button id="infoButton">

        ℹ

    </button>

    <div id="infoOverlay">

        <button id="closeInfo">×</button>

        <div id="languageButtons"></div>

        <img id="infoImage">

    </div>

    <script>

        const params = new URLSearchParams(window.location.search);
        const model = params.get("model");

        if (model) {

            document.getElementById("viewer").src = "models/" + model;


            fetch("models.json")
                .then(response => response.json())
                .then(models => {

                    const current = models.find(m => m.file === model);


                    if (current) {

                        document.getElementById("model-name").textContent =
                            current.name;


                        const infoButton =
                            document.getElementById("infoButton");

                        const overlay =
                            document.getElementById("infoOverlay");

                        const infoImage =
                            document.getElementById("infoImage");

                        const languageButtons =
                            document.getElementById("languageButtons");


                        infoButton.addEventListener("click", () => {


                            languageButtons.innerHTML = "";


                            Object.keys(current.info).forEach(language => {


                                const button =
                                    document.createElement("button");


                                button.textContent = language;

                                button.className =
                                    "language-button";


                                button.addEventListener("click", () => {

                                    infoImage.src =
                                        current.info[language];

                                });


                                languageButtons.appendChild(button);


                            });


                            const firstLanguage =
                                Object.keys(current.info)[0];


                            infoImage.src =
                                current.info[firstLanguage];


                            overlay.style.display = "flex";


                        });


                    }


                });


        }

        document
            .getElementById("closeInfo")
            .addEventListener("click", () => {

                document.getElementById("infoOverlay").style.display = "none";

            });

        document
            .getElementById("fullscreenButton")
            .addEventListener("click", () => {

                document
                    .getElementById("viewer")
                    .requestFullscreen();

            });

    </script>

</body>

</html>
