<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Viewer</title>

    <link rel="stylesheet" href="style.css">

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

</head>

<body>

    <header>

        <a href="index.html">← Tagasi / Back</a>

        <h1 id="model-name">Laadin...</h1>

    </header>

    <main>

        <model-viewer id="viewer" camera-controls auto-rotate shadow-intensity="1" exposure="1" loading="eager"
            touch-action="pan-y" interaction-prompt="auto">

        </model-viewer>

    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const model = params.get("model");

        if (model) {
            document.getElementById("viewer").src = "models/" + model;
            document.getElementById("model-name").textContent = model.replace(".glb", "");
        } else {
            document.getElementById("model-name").textContent = "No model selected";
        }
    </script>

</body>

</html>
